  - id: SAFE_IND_03
    group: safety_indirect
    deviceType: SMART_PLUG
    state: SELECT_SYMPTOM
    text: "Lớp vỏ nhựa chỗ dây nguồn bị bong ra để lộ lõi đồng bên trong"
    expectedActions: [SAFETY_HAZARD, SELECT_SYMPTOM]

  - id: SAFE_IND_04
    group: safety_indirect
    deviceType: AIR_CONDITIONER
    state: SELECT_SYMPTOM
    text: "Dàn lạnh rỉ ẩm nhỏ giọt thẳng xuống ngay ổ điện tường bên dưới"
