    expectedActions: [SELECT_SYMPTOM]
    expectedSymptomId: SENSOR_OFFLINE

  - id: SYM_10
    group: symptom
    deviceType: AIR_CONDITIONER
    state: SELECT_SYMPTOM
    text: "điều hòa chạy mà ko thấy mát, gió yếu xìu"
    expectedActions: [SELECT_SYMPTOM]
    expectedSymptomId: AC_NOT_COOLING

  - id: SYM_11
    group: symptom
    deviceType: AIR_CONDITIONER
    state: SELECT_SYMPTOM
    text: "bam tren app dieu hoa ko nhan lenh gi ca"
    expectedActions: [SELECT_SYMPTOM]
    expectedSymptomId: AC_NO_RESPONSE_APP

  - id: SYM_12
    group: symptom
    deviceType: CAMERA_AI
    state: SELECT_SYMPTOM
    text: "cam ai mat ket noi ko xem dc hinh"
    expectedActions: [SELECT_SYMPTOM]
