# Bộ dữ liệu đánh giá (Eval) 40 câu tiếng Việt cho MaintenanceTextInterpreter
# Các nhóm: symptom, guided_step, safety, ambiguous, out_of_scope, escalate, injection
cases:
  # --- Nhóm 1: Phân loại triệu chứng (có dấu, không dấu, viết tắt, lỗi chính tả) ---
  - id: SYM_01
    group: symptom
    deviceType: LIGHT
    state: SELECT_SYMPTOM
    text: "đèn phòng khách bật hoài ko sáng, nghe tiếng rè"
    expectedActions: [SELECT_SYMPTOM]
    expectedSymptomId: LIGHT_NOT_TURNING_ON

  - id: SYM_02
    group: symptom
    deviceType: LIGHT
    state: SELECT_SYMPTOM
    text: "den bi mat ket noi tren app roi, bam bat tat ko dc"
