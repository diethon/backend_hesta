  - id: SAFE_IND_06
    group: safety_indirect
    deviceType: LIGHT
    state: SELECT_SYMPTOM
    text: "Mỗi lần gạt công tắc đèn lại thấy ánh chớp nhỏ lóe lên trong khe công tắc"
