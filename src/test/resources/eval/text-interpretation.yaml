    expectedActions: [SELECT_SYMPTOM]
    expectedSymptomId: CAM_BLURRY_OR_AI_ISSUE

  # --- Cửa cuốn (ROLLING_DOOR -> DOOR_GATE) ---
  - id: SYM_14
    group: symptom
    deviceType: ROLLING_DOOR
    state: SELECT_SYMPTOM
    text: "cửa cuốn mất kết nối rồi, bấm mở trên app không thấy phản hồi"
    expectedActions: [SELECT_SYMPTOM]
    expectedSymptomId: DOOR_GATE_OFFLINE

  - id: SYM_15
    group: symptom
    deviceType: ROLLING_DOOR
    state: SELECT_SYMPTOM
    text: "cửa cuốn chạy lên được nửa chừng rồi tự dừng lại không lên tiếp"
    expectedActions: [SELECT_SYMPTOM]
    expectedSymptomId: DOOR_GATE_NOT_MOVING

  - id: SYM_16
    group: symptom
    deviceType: ROLLING_DOOR
    state: SELECT_SYMPTOM
    text: "cửa cuốn bị lệch ray đóng không kín, cần thợ sửa"
    expectedActions: [SELECT_SYMPTOM, ESCALATE_REQUEST]
    expectedSymptomId: DOOR_GATE_MECHANICAL_FAULT

  # --- Cảm biến khói (SMOKE_SENSOR -> SAFETY_SENSOR) ---
  - id: SYM_17
    group: symptom
    deviceType: SMOKE_SENSOR
    state: SELECT_SYMPTOM
    text: "cảm biến khói trong bếp bị offline từ tối qua không gửi dữ liệu"
    expectedActions: [SELECT_SYMPTOM]
    expectedSymptomId: SAFETY_SENSOR_OFFLINE

  - id: SYM_18
    group: symptom
    deviceType: SMOKE_SENSOR
    state: SELECT_SYMPTOM
    text: "cảm biến khói cứ báo động giả liên tục dù phòng trống hoàn toàn bình thường"
    expectedActions: [SELECT_SYMPTOM]
    expectedSymptomId: SAFETY_SENSOR_FALSE_ALARM

  - id: SYM_19
    group: symptom
    deviceType: SMOKE_SENSOR
    state: SELECT_SYMPTOM
    text: "cảm biến khói bị rơi xuống đất nứt vỏ ngoài rồi"
    expectedActions: [SELECT_SYMPTOM, ESCALATE_REQUEST]
    expectedSymptomId: SAFETY_SENSOR_HARDWARE_FAULT

  # --- Máy bơm nước (WATER_PUMP -> WATER_PUMP) ---
  - id: SYM_20
    group: symptom
    deviceType: WATER_PUMP
    state: SELECT_SYMPTOM
    text: "máy bơm nước mất kết nối trên app ko bật tắt được"
    expectedActions: [SELECT_SYMPTOM]
    expectedSymptomId: PUMP_OFFLINE

  - id: SYM_21
    group: symptom
    deviceType: WATER_PUMP
    state: SELECT_SYMPTOM
    text: "app báo máy bơm đang bật mà chẳng thấy nước lên bồn"
    expectedActions: [SELECT_SYMPTOM]
    expectedSymptomId: PUMP_NO_WATER_OR_WEAK

  # --- Nhóm 2: Trả lời ngắn trong GUIDED_STEP ---
  - id: STEP_01
    group: guided_step
    deviceType: LIGHT
    state: GUIDED_STEP
    currentSymptomId: LIGHT_OFFLINE
    text: "ổn rồi bạn ơi, đèn sáng lại rồi"
    expectedActions: [ANSWER_STEP_RESOLVED]

  - id: STEP_02
    group: guided_step
    deviceType: LIGHT
    state: GUIDED_STEP
    currentSymptomId: LIGHT_OFFLINE
    text: "ok dc roi"
    expectedActions: [ANSWER_STEP_RESOLVED]

  - id: STEP_03
    group: guided_step
    deviceType: LIGHT
    state: GUIDED_STEP
    currentSymptomId: LIGHT_OFFLINE
    text: "hết rồi cảm ơn"
    expectedActions: [ANSWER_STEP_RESOLVED]

  - id: STEP_04
    group: guided_step
    deviceType: LIGHT
    state: GUIDED_STEP
    currentSymptomId: LIGHT_OFFLINE
    text: "vẫn vậy à, chưa được"
    expectedActions: [ANSWER_STEP_NOT_RESOLVED]

  - id: STEP_05
    group: guided_step
    deviceType: LIGHT
    state: GUIDED_STEP
    currentSymptomId: LIGHT_OFFLINE
    text: "chua len ban oi"
    expectedActions: [ANSWER_STEP_NOT_RESOLVED]

  - id: STEP_06
    group: guided_step
    deviceType: SMART_PLUG
    state: GUIDED_STEP
    currentSymptomId: PLUG_OFFLINE
    text: "rút ra cắm lại rồi mà vẫn y nguyên"
    expectedActions: [ANSWER_STEP_NOT_RESOLVED]

  # --- Nhóm 3: An toàn (có dấu & không dấu — Lớp 1 phải chặn trước LLM) ---
  - id: SAFE_01
    group: safety
    deviceType: LIGHT
    state: SELECT_SYMPTOM
    text: "hình như có mùi khét bốc ra từ đèn"
    expectedActions: [SAFETY_HAZARD]

  - id: SAFE_02
    group: safety
    deviceType: SMART_PLUG
    state: SELECT_SYMPTOM
    text: "o cam bi xet tia lua va nong bong tay"
    expectedActions: [SAFETY_HAZARD]

  - id: SAFE_03
    group: safety
    deviceType: SMART_PLUG
    state: GUIDED_STEP
    currentSymptomId: PLUG_OFFLINE
    text: "cham vao vo thay bi giat dien"
    expectedActions: [SAFETY_HAZARD]

  - id: SAFE_04
    group: safety
    deviceType: CAMERA_AI
    state: SELECT_SYMPTOM
    text: "mưa tạt nên bị nước vào thiết bị rồi"
    expectedActions: [SAFETY_HAZARD]

  - id: SAFE_05
    group: safety
    deviceType: LIGHT
    state: SELECT_SYMPTOM
    text: "nghe tieng no bup roi boc khoi den"
    expectedActions: [SAFETY_HAZARD]

