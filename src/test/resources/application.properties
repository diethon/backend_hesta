spring.datasource.url=jdbc:h2:mem:hesta-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false
app.google.client-id=test-client-id
cloudinary.cloud-name=test-cloud
cloudinary.api-key=test-key
cloudinary.api-secret=test-secret
spring.mail.host=localhost
spring.mail.username=test@example.com
mqtt.broker.url=tcp://localhost:1883
mqtt.client.id=hesta-test
mqtt.inbound.auto-startup=false
mqtt.direct.auto-connect=false
mqtt.reconciliation.enabled=false
mqtt.topic.device.command=hesta/test/device/command
hesta.scheduler.enabled=false
app.realtime.websocket.heartbeat=20s
