spring.application.name=backend
spring.profiles.active=local
spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=false

# Fix "max clients" error by limiting HikariCP pool size
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# Avatar uploads: keep the request allowance slightly above the file limit for multipart overhead.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Google OAuth 2.0
app.google.client-id=${GOOGLE_CLIENT_ID}

# Cloudinary Setup
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Shared WebSocket/STOMP heartbeat interval
app.realtime.websocket.heartbeat=${REALTIME_WEBSOCKET_HEARTBEAT:20s}

# MQTT Configuration
mqtt.broker.url=${MQTT_BROKER_URL:tcp://192.168.137.107:1883}
#mqtt.broker.url=${MQTT_BROKER_URL:tcp://localhost:1883}
mqtt.client.id=hesta-backend-${random.uuid}
mqtt.username=${MQTT_USERNAME:}
mqtt.password=${MQTT_PASSWORD:}
mqtt.topic.default=${MQTT_TOPIC_DEFAULT:hesta/outbound}
mqtt.inbound.auto-startup=${MQTT_INBOUND_AUTO_STARTUP:true}

# Local time zone used by scene and automation schedules.
hesta.scheduler.zone=${HESTA_SCHEDULER_ZONE:Asia/Ho_Chi_Minh}

# Dynamic MQTT Config
mqtt.topic.prefix=${MQTT_TOPIC_PREFIX:hesta/nodes}
mqtt.command.timeout-ms=${MQTT_COMMAND_TIMEOUT_MS:1200}

# MQTT Circuit Breaker Configuration (Chống block lệnh khi điều khiển đèn / thiết bị)
mqtt.circuit-breaker.enabled=${MQTT_CIRCUIT_BREAKER_ENABLED:false}
mqtt.circuit-breaker.failure-threshold=${MQTT_CIRCUIT_BREAKER_FAILURE_THRESHOLD:50}
mqtt.circuit-breaker.cooldown-seconds=${MQTT_CIRCUIT_BREAKER_COOLDOWN_SECONDS:5}

# Internal API Key for voice-service communication
hesta.internal.api-key=${INTERNAL_API_KEY:super_secret_voice_key_123}
