spring.application.name=backend
spring.profiles.active=local
spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=false
spring.jpa.properties.hibernate.default_batch_fetch_size=30

# Fix "max clients" error by limiting HikariCP pool size
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED

# Upload limits (Avatars enforce 5MB in UserServiceImpl; OTA firmware .bin allows up to 20MB)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=22MB

# Google OAuth 2.0
app.google.client-id=${GOOGLE_CLIENT_ID}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000,https://hesta.homes,https://dashboard.hesta.homes}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Cloudinary Setup
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:hestasmarthome@gmail.com}
spring.mail.password=${MAIL_PASSWORD:lmlw ggcq yodq tmoh}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Shared WebSocket/STOMP heartbeat interval
app.realtime.websocket.heartbeat=${REALTIME_WEBSOCKET_HEARTBEAT:20s}

# MQTT Configuration
mqtt.broker.url=${MQTT_BROKER_URL:tcp://192.168.88.120:1883}
#mqtt.broker.url=${MQTT_BROKER_URL:tcp://localhost:1883}
mqtt.client.id=hesta-backend-${random.uuid}
mqtt.username=${MQTT_USERNAME:}
mqtt.password=${MQTT_PASSWORD:}
mqtt.topic.default=${MQTT_TOPIC_DEFAULT:hesta/outbound}
mqtt.inbound.auto-startup=${MQTT_INBOUND_AUTO_STARTUP:true}

# Local time zone used by scene and automation schedules.
hesta.scheduler.zone=${HESTA_SCHEDULER_ZONE:Asia/Ho_Chi_Minh}


# Dynamic MQTT Config
mqtt.topic.prefix=${MQTT_TOPIC_PREFIX:hesta/nodes}
mqtt.command.timeout-ms=${MQTT_COMMAND_TIMEOUT_MS:3000}
mqtt.ping.timeout-ms=${MQTT_PING_TIMEOUT_MS:3000}

# MQTT Circuit Breaker Configuration
mqtt.circuit-breaker.enabled=${MQTT_CIRCUIT_BREAKER_ENABLED:true}
mqtt.circuit-breaker.failure-threshold=${MQTT_CIRCUIT_BREAKER_FAILURE_THRESHOLD:30}
mqtt.circuit-breaker.cooldown-seconds=${MQTT_CIRCUIT_BREAKER_COOLDOWN_SECONDS:30}

# OTA Firmware Management Configuration
hesta.ota.storage-dir=${HESTA_OTA_STORAGE_DIR:uploads/firmware}
hesta.ota.public-base-url=${HESTA_OTA_PUBLIC_BASE_URL:http://192.168.100.187:8080}
hesta.ota.node-timeout-seconds=${HESTA_OTA_NODE_TIMEOUT_SECONDS:180}

# Internal API Key for voice-service communication
hesta.internal.api-key=${INTERNAL_API_KEY:super_secret_voice_key_123}
BACKEND_BASE_URL=http://localhost:8080

# Machine Learning Service Configuration
hesta.ml-service.url=${HESTA_ML_SERVICE_URL:http://localhost:8000}
hesta.ml-service.timeout-ms=${HESTA_ML_SERVICE_TIMEOUT_MS:30000}
hesta.ml-service.api-key=${HESTA_ML_SERVICE_API_KEY:}
hesta.recommendation.confidence-threshold=${HESTA_RECOMMENDATION_CONFIDENCE_THRESHOLD:0.80}
hesta.recommendation.cooldown-hours=${HESTA_RECOMMENDATION_COOLDOWN_HOURS:24}

# Background Recommendation & Safe Retraining Scheduling
hesta.recommendation.scheduler.enabled=${HESTA_RECOMMENDATION_SCHEDULER_ENABLED:true}
hesta.recommendation.auto-generate.enabled=${HESTA_RECOMMENDATION_AUTO_GENERATE_ENABLED:true}
hesta.recommendation.auto-generate.cron=${HESTA_RECOMMENDATION_AUTO_GENERATE_CRON:0 0 2-5 * * ?}
hesta.recommendation.auto-generate.lookback-days=${HESTA_RECOMMENDATION_AUTO_GENERATE_LOOKBACK_DAYS:30}
hesta.recommendation.auto-retrain.enabled=${HESTA_RECOMMENDATION_AUTO_RETRAIN_ENABLED:true}
hesta.recommendation.auto-retrain.cron=${HESTA_RECOMMENDATION_AUTO_RETRAIN_CRON:0 0 3 * * SUN}
hesta.recommendation.auto-retrain.min-new-events=${HESTA_RECOMMENDATION_AUTO_RETRAIN_MIN_NEW_EVENTS:100}

# Granular Member Access Control Feature Flag
access.custom-scope.enabled=${ACCESS_CUSTOM_SCOPE_ENABLED:true}


# ===================================================================
# Tier-1 Rule-based Anomaly Detection Configuration
# NOTE: Baseline defaults for MQ-x and DHT sensors. Adjust per hardware.
# ===================================================================
hesta.anomaly.enabled=${HESTA_ANOMALY_ENABLED:true}
hesta.anomaly.offline-threshold=5m
hesta.anomaly.offline-check-interval=60s
hesta.anomaly.offline-grace-period=5m
hesta.anomaly.offline-max-age=24h

# Metric Thresholds: Gas (400/1000), Smoke (300/1000), Temperature (50/65)
hesta.anomaly.metrics.gas_ppm.enabled=true
hesta.anomaly.metrics.gas_ppm.warn=400.0
hesta.anomaly.metrics.gas_ppm.critical=1000.0

hesta.anomaly.metrics.smoke.enabled=true
hesta.anomaly.metrics.smoke.warn=300.0
hesta.anomaly.metrics.smoke.critical=1000.0

hesta.anomaly.metrics.temperature.enabled=true
hesta.anomaly.metrics.temperature.warn=50.0
hesta.anomaly.metrics.temperature.critical=65.0

# ===================================================================
# Maintenance Attachment, Rate Limit & AI (Gemini) Configuration
# ===================================================================
hesta.maintenance.attachment.cloudinary-type=${HESTA_MAINTENANCE_ATTACHMENT_CLOUDINARY_TYPE:authenticated}
hesta.maintenance.attachment.cleanup-interval=${HESTA_MAINTENANCE_ATTACHMENT_CLEANUP_INTERVAL:1h}

hesta.maintenance.rate-limit.messages-per-day=${HESTA_MAINTENANCE_RL_MESSAGES_PER_DAY:100}
hesta.maintenance.rate-limit.uploads-per-day=${HESTA_MAINTENANCE_RL_UPLOADS_PER_DAY:30}
hesta.maintenance.rate-limit.max-active-conversations=${HESTA_MAINTENANCE_RL_MAX_ACTIVE_CONVS:5}
hesta.maintenance.rate-limit.llm-calls-per-day=${HESTA_MAINTENANCE_RL_LLM_CALLS_PER_DAY:60}
hesta.maintenance.rate-limit.image-analyses-per-day=${HESTA_MAINTENANCE_RL_IMAGE_ANALYSES_PER_DAY:20}

# AI (Gemini) — KHÔNG dùng alias "-latest" cho production; luôn ghim phiên bản model ổn định (vd: gemini-3.5-flash-lite, gemini-3.5-flash)
hesta.ai.enabled=${HESTA_AI_ENABLED:false}
hesta.ai.provider=${HESTA_AI_PROVIDER:gemini}
hesta.ai.gemini.api-key=${GEMINI_API_KEY:}
hesta.ai.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
hesta.ai.gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
hesta.ai.gemini.vision-model=${GEMINI_VISION_MODEL:gemini-3.5-flash-lite}
hesta.ai.gemini.timeout=${GEMINI_TIMEOUT:20s}
hesta.ai.gemini.max-retries=${GEMINI_MAX_RETRIES:2}
hesta.ai.gemini.retry-backoff-ms=${GEMINI_RETRY_BACKOFF_MS:500}
hesta.ai.text-interpreter.max-history-messages=${HESTA_AI_MAX_HISTORY:6}
hesta.ai.text-interpreter.max-input-chars=${HESTA_AI_MAX_INPUT_CHARS:500}
hesta.ai.text-interpreter.confidence-threshold=${HESTA_AI_CONFIDENCE_THRESHOLD:0.6}
hesta.ai.text-interpreter.max-consecutive-clarifies=${HESTA_AI_MAX_CLARIFIES:2}
hesta.ai.text-interpreter.max-llm-calls-per-conversation=${HESTA_AI_MAX_CALLS_PER_CONV:15}
hesta.ai.image-analyzer.max-dimension-px=${HESTA_AI_IMAGE_MAX_DIM:1280}
hesta.ai.image-analyzer.confidence-threshold=${HESTA_AI_IMAGE_CONFIDENCE_THRESHOLD:0.65}
hesta.ai.image-analyzer.hazard-caution-threshold=${HESTA_AI_IMAGE_HAZARD_CAUTION:0.40}
hesta.ai.image-analyzer.hazard-urgent-threshold=${HESTA_AI_IMAGE_HAZARD_URGENT:0.70}
hesta.ai.image-analyzer.max-retakes=${HESTA_AI_IMAGE_MAX_RETAKES:2}
hesta.ai.image-analyzer.max-images-per-conversation=${HESTA_AI_IMAGE_MAX_PER_CONV:3}
hesta.ai.ticket-summary.enabled=${HESTA_AI_TICKET_SUMMARY_ENABLED:false}
hesta.ai.eval.delay-ms=${HESTA_AI_EVAL_DELAY_MS:6000}

# Phase 4: Retention & Email Notification (safe defaults)
hesta.assistant.retention.messages-days=${HESTA_ASSISTANT_RETENTION_MESSAGES_DAYS:90}
hesta.assistant.retention.orphan-images-days=${HESTA_ASSISTANT_RETENTION_ORPHAN_IMAGES_DAYS:1}
hesta.maintenance.email.enabled=${HESTA_MAINTENANCE_EMAIL_ENABLED:false}
hesta.maintenance.email.admin-recipients=${HESTA_MAINTENANCE_EMAIL_ADMIN_RECIPIENTS:}
hesta.maintenance.email.max-per-ticket-per-hour=${HESTA_MAINTENANCE_EMAIL_MAX_PER_TICKET_HOUR:4}

# ===================================================================
# Redis Distributed Cache & Rate Limiting (Fail-open to in-memory)
# ===================================================================
hesta.redis.enabled=${HESTA_REDIS_ENABLED:false}
hesta.redis.local-cache-enabled=${HESTA_REDIS_LOCAL_CACHE_ENABLED:true}
hesta.redis.key-prefix=${HESTA_REDIS_KEY_PREFIX:hesta:}
hesta.redis.circuit-breaker-cooldown-ms=${HESTA_REDIS_CIRCUIT_BREAKER_COOLDOWN_MS:15000}
hesta.redis.max-local-fallback-entries=${HESTA_REDIS_MAX_LOCAL_ENTRIES:2000}
hesta.redis.scan-batch-size=${HESTA_REDIS_SCAN_BATCH_SIZE:200}
spring.data.redis.repositories.enabled=false
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:${REDIS_HOST:localhost}}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6379}}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:${REDIS_PASSWORD:}}
spring.data.redis.database=${SPRING_DATA_REDIS_DATABASE:0}
spring.data.redis.timeout=${SPRING_DATA_REDIS_TIMEOUT:1500ms}
spring.data.redis.connect-timeout=${SPRING_DATA_REDIS_CONNECT_TIMEOUT:1500ms}
