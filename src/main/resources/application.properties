spring.application.name=backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Shared WebSocket/STOMP heartbeat interval.
app.realtime.websocket.heartbeat=${REALTIME_WEBSOCKET_HEARTBEAT:20s}
# MQTT Configuration
mqtt.broker.url=tcp://localhost:1883
mqtt.client.id=hesta-backend-${random.uuid}
mqtt.username=
mqtt.password=
mqtt.topic.default=hesta/outbound

