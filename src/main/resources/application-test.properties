spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

hesta.internal.api-key=super_secret_voice_key_123

# Cloudinary Setup mock
cloudinary.cloud-name=mock
cloudinary.api-key=mock
cloudinary.api-secret=mock

# Disable MQTT reconciliation on startup since no local Mosquitto is running
mqtt.reconciliation.enabled=false

# Machine Learning Service Configuration for Tests
hesta.ml-service.url=http://localhost:8000
hesta.ml-service.timeout-ms=2000
hesta.recommendation.confidence-threshold=0.80
hesta.recommendation.cooldown-hours=24
