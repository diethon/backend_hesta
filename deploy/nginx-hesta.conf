# /etc/nginx/sites-available/hesta: web dashboard (HTTPS added by certbot --nginx).
# Landing page hesta.homes is deployed by the hesta_landingpage repo to /var/www/hesta-landing.
server {
    listen 80;
    server_name dashboard.hesta.homes;

    root /var/www/hesta;
    index index.html;
    client_max_body_size 25m;

    location / {
        try_files $uri $uri/ /index.html;
    }


}

# Backend-only host for mobile apps and devices: everything goes to Spring Boot.
# Installed as /etc/nginx/sites-available/hesta-api (HTTPS added by certbot --nginx).
server {
    listen 80;
    server_name api.hesta.homes;
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }
}
