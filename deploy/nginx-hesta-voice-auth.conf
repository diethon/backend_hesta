# /etc/nginx/snippets/hesta-voice-auth.conf, included inside the voice.hesta.homes server block.
# Voice commands control real devices, so only requests with a valid user JWT reach the Pi.
# The backend validates the token; /api/voice/tts stays open because <audio> cannot send headers.
location /api/voice/ {
    auth_request /_hesta_auth;
    proxy_pass http://127.0.0.1:18001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}

location /api/voice/tts {
    proxy_pass http://127.0.0.1:18001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 60s;
}

location = /_hesta_auth {
    internal;
    # CORS preflight carries no token; let it through to the Pi's CORS handler.
    if ($request_method = OPTIONS) { return 204; }
    proxy_pass http://127.0.0.1:8080/api/v1/homes/my-homes;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Host api.hesta.homes;
}
