# Production stack on the VPS (/opt/hesta). CI copies this folder, app.jar and recommendation-service/ here.
# Secrets live only in /opt/hesta/.env on the VPS (see .env.example).
services:
  backend:
    image: eclipse-temurin:21-jre
    container_name: hesta-backend
    working_dir: /app
    command: ["java", "-Xms256m", "-Xmx768m", "-jar", "/app/app.jar"]
    env_file: .env
    environment:
      MQTT_BROKER_URL: tcp://mosquitto:1883
      HESTA_ML_SERVICE_URL: http://recommendation:8000
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - ./app.jar:/app/app.jar:ro
      - ./uploads:/app/uploads
    ports:
      - "127.0.0.1:8080:8080"
    depends_on: [mosquitto, redis, recommendation]
    restart: unless-stopped

  recommendation:
    build: ./recommendation-service
    container_name: hesta-recommendation
    env_file: .env.recommendation
    environment:
      TIMEZONE: Asia/Ho_Chi_Minh
    volumes:
      - ./recommendation-artifacts:/app/artifacts
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2.0.18
    container_name: hesta-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro
      - ./mosquitto/data:/mosquitto/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: hesta-redis
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru"]
    env_file: .env
    volumes:
      - ./redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
