
services:
  mosquitto:
    image: eclipse-mosquitto:2.0.18
    container_name: hesta-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: hesta-redis-local
    env_file:
      - path: .env
        required: false
    command:
      - sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
        else
          exec redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
        fi
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped